name: Local workflow checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest pytest-asyncio
      - run: python -m compileall -q codegen.py error_helper.py rag_engine.py web_app.py tests
      - run: python -m pytest tests --override-ini addopts='' -q
